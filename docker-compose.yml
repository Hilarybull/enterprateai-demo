services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - MONGO_URI=mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  mongo_data:

